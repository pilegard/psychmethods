<a href="#book-body-start" class="skip-link">Skip to main content</a>

<style>
.skip-link {
  position: absolute;
  top: -100%;
  left: 0;
  background: #000;
  color: #fff;
  padding: 8px 16px;
  z-index: 9999;
  text-decoration: none;
  font-size: 14px;
}
.skip-link:focus {
  top: 0;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var main = document.querySelector(".page-inner");
  if (main) {
    main.id = "book-body-start";
    main.setAttribute("tabindex", "-1");
  }

  var skip = document.querySelector('.skip-link');
  if (skip) {
    skip.addEventListener('click', function () {
      setTimeout(function () {
        var target = document.getElementById('book-body-start');
        if (target) target.focus();
      }, 0);
    });
  }
});
</script>
